name: Publicar Ferreteria en GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar frontend
    runs-on: ubuntu-latest

    steps:
      # ===================================================
      # DESCARGAR REPOSITORIO
      # ===================================================
      - name: Descargar repositorio
        uses: actions/checkout@v6

      # ===================================================
      # CONFIGURAR NODE
      # ===================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # ===================================================
      # INSTALAR DEPENDENCIAS
      # ===================================================
      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm install

      # ===================================================
      # COMPILAR FRONTEND
      # ===================================================
      - name: Compilar React
        working-directory: ./frontend
        env:
          VITE_BASE_PATH: /Ferreteria_Alejandra/
          VITE_API_URL: https://ferreteria-alejandra.onrender.com
        run: npm run build

      # ===================================================
      # CONFIGURAR GITHUB PAGES
      # ===================================================
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      # ===================================================
      # SUBIR ARCHIVOS COMPILADOS
      # ===================================================
      - name: Preparar archivos
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./frontend/dist

  deploy:
    name: Publicar aplicación

    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ===================================================
      # PUBLICAR
      # ===================================================
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
